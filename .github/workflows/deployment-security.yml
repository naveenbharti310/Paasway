name: Deployed production App Check boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify malformed requests are rejected by App Check before business logic
        run: node passway-app/scripts/check-deployed-app-check.cjs